<script>
let THREE;
'use strict';
const $=id=>document.getElementById(id);
const stops=[
  ['지구','1977.09.05','지구 출발','보이저 1호가 지구를 떠나 외행성으로 향한다.','earth'],
  ['목성','1979.03.05','목성 근접','거대한 구름띠 사이로 대적점이 모습을 드러낸다.','jupiter'],
  ['토성','1980.11.12','토성 근접','얼음 입자로 이루어진 고리 너머로 토성을 지난다.','saturn'],
  ['성간공간','2012.08.25','성간공간 진입','태양권 너머에서 돌아본 지구가 작은 푸른 점으로 멀어진다.','space']
];
const duration=Number($('seek').max), arrivals=[0,17,34,51];
let time=0,playing=false,selected=-1,jump=null,ready=false,renderScene;
const buttons=stops.map(([name,date,,,icon],i)=>{
  const button=document.createElement('button');button.className='waypoint';
  button.innerHTML='<span class="thumb '+(i===3?'space':'')+'" aria-hidden="true">'+(i===3?'':'<i class="globe '+icon+'"></i>')+'</span><span><strong>'+name+'</strong><span class="card-date">'+date+'</span></span><span class="arrow" aria-hidden="true">↗</span>';
  button.disabled=true;button.addEventListener('click',()=>fly(i));$('routes').append(button);return button;
});
function setCaption(i) {
  const outbound=i===2&&time>=39;
  const [,date,title,description]=outbound
    ? ['토성','1980 — 2012','성간공간을 향해','토성을 뒤로하고 태양풍이 닿는 경계로 향한다.']
    : time>=48?['지구','EPILOGUE','창백한 푸른 점','이 작은 점이 우리가 떠나온 지구다.']:stops[i];
  if(selected===i&&$('caption').textContent===title)return;
  selected=i;
  $('date').textContent=date.replaceAll('.',' . ');$('caption').textContent=title;$('desc').textContent=description;
  $('number').textContent=String(i+1).padStart(2,'0');
  buttons.forEach((button,k)=>button.setAttribute('aria-current',String(k===i)));
}
function sync() {
  setCaption(time<12?0:time<29?1:time<46?2:3);
  $('seek').value=time;$('seek').style.setProperty('--progress',100*time/duration+'%');
  $('elapsed').textContent=(time>=60?'01:':'00:')+String(Math.floor(time)%60).padStart(2,'0');
  $('seek').setAttribute('aria-valuetext',Math.floor(time)+'초, '+$('caption').textContent);
  $('action').textContent=playing?'일시정지':time===duration?'다시 재생':'재생';
  $('glyph').setAttribute('d',playing?'M3 2h4v14H3zM11 2h4v14h-4z':'M4 2l11 7-11 7z');
}
function fly(i) {
  const to=arrivals[i], distance=Math.abs(time-to);
  const continueTour=jump?playing&&jump.continueTour:playing;
  if(distance<.05||matchMedia('(prefers-reduced-motion: reduce)').matches){
    time=to;jump=null;playing=continueTour;
  } else {
    jump={from:time,to,elapsed:0,seconds:Math.min(10,2+distance*.16),continueTour};
    playing=true;
  }
  lastStamp=null;
  sync();wake();
}
let frameTimer=0,lastStamp=null;
function wake(){if(ready&&!frameTimer&&!document.hidden)frameTimer=setTimeout(()=>frame(performance.now()),1000/30);}
function frame(stamp) {
  frameTimer=0;
  const delta=lastStamp===null?0:Math.max(0,(stamp-lastStamp)/1000);lastStamp=stamp;
  if(playing){
    if(jump){
      jump.elapsed+=delta;
      const progress=clamp(jump.elapsed/jump.seconds);
      time=mix(jump.from,jump.to,smooth(progress));
      if(progress===1){time=jump.to;playing=jump.continueTour;jump=null;}
    } else {
      time=Math.min(duration,time+delta);if(time===duration)playing=false;
    }
    sync();
  }
  renderScene();
  if(playing)wake();else lastStamp=null;
}
$('play').onclick=()=>{
  if(time===duration)time=0;
  playing=!playing;lastStamp=null;sync();wake();
};
$('seek').oninput=e=>{if(jump)playing=playing&&jump.continueTour;jump=null;time=Number(e.target.value);lastStamp=null;if(time===duration)playing=false;sync();wake();};
document.addEventListener('visibilitychange',()=>{lastStamp=null;if(document.hidden){clearTimeout(frameTimer);frameTimer=0;}else wake();});
const panel=$('console');
if(!panel.requestFullscreen||!document.fullscreenEnabled)$('expand').hidden=true;
$('expand').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await panel.requestFullscreen();}catch{$('expand').hidden=true;}};

sync();

// All surface maps are painted locally from geographic outlines and seeded noise.
let seed = 19770905;
function random() { seed = (Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; }

const smooth = x => x*x*(3-2*x);
const clamp = x => Math.min(1,Math.max(0,x));
const mix = (a,b,t) => a+(b-a)*t;
function noise(x,y) {
  const i=Math.floor(x), j=Math.floor(y), u=smooth(x-i), v=smooth(y-j);
  const k=((j&255)<<8)+(i&255), n=(k&65280)+((i+1)&255);
  return mix(mix(table[k],table[n],u),mix(table[(k+256)&65535],table[(n+256)&65535],u),v);

function fb(x,y) {
  return .52*noise(x,y)+.27*noise(2*x+79,2*y)+.14*noise(4*x,4*y+29)+.07*noise(8*x,8*y);
